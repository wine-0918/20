<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>マスターマインド</title>
    <link rel="stylesheet" href="mastermind.css">
</head>
<body>

    <!-- 戻るボタン -->
    <button class="back-btn" onclick="history.back()">← 戻る</button>

    <!-- ====== スタート画面 ====== -->
    <div id="screen-start" class="screen active">
        <div class="start-box">
            <h1 class="game-title">MASTERMIND</h1>
            <p class="game-subtitle">ヒット＆ブロー</p>
            <div class="rule-box">
                <p>🔴 Hit：色も位置も正解</p>
                <p>⚪ Blow：色は正解、位置が違う</p>
                <p>同じ正解コード（色4つ）を<br>先に当てた方が勝ち！</p>
                <p>各4ターン × 2人 = 合計8回</p>
            </div>
            <button class="btn-primary" id="btn-start">ゲーム開始</button>
        </div>
    </div>

    <!-- ====== 先攻決め画面 ====== -->
    <div id="screen-coin" class="screen">
        <div class="coin-box">
            <h2>先攻を決めます</h2>
            <div id="coin" class="coin">🪙</div>
            <p id="coin-result" class="coin-result"></p>
            <button class="btn-primary" id="btn-toss">コイントス！</button>
            <button class="btn-secondary hidden" id="btn-go-game">ゲームへ進む</button>
        </div>
    </div>

    <!-- ====== メインゲーム画面 ====== -->
    <div id="screen-game" class="screen">

        <!-- ターン表示 -->
        <div class="turn-banner">
            <span id="turn-label">1P のターン</span>
            <span id="turn-count">1 / 4 ターン目</span>
        </div>

        <!-- ヒントラベル -->
        <div class="hint-legend">
            <span class="pin hit"></span>Hit：色と場所が正解
            &nbsp;&nbsp;
            <span class="pin blow"></span>Blow：色だけ正解
        </div>

        <!-- ボード -->
        <div class="board-wrap">
            <div class="board" id="board">
                <!-- レーン1P (ターン1-4) と 2P (ターン1-4) を JS で生成 -->
            </div>
        </div>

        <!-- カラーパレット -->
        <div class="palette-wrap">
            <div class="palette" id="palette">
                <!-- JS で生成 -->
            </div>
            <div class="palette-actions">
                <button class="btn-clear" id="btn-clear">クリア</button>
                <button class="btn-submit" id="btn-submit">判定</button>
            </div>
        </div>

    </div>

    <!-- ====== 結果モーダル ====== -->
    <div id="modal-result" class="modal hidden">
        <div class="modal-box">
            <h2 id="modal-title">結果</h2>
            <div id="modal-answer" class="modal-answer"></div>
            <p id="modal-message"></p>
            <button class="btn-primary" id="btn-next-round">次のラウンドへ</button>
            <button class="btn-secondary" id="btn-back">前のページへ戻る</button>
        </div>
    </div>

    <!-- ====== パス画面（端末を次のプレイヤーに渡す） ====== -->
    <div id="screen-pass" class="screen">
        <div class="pass-box">
            <h2 id="pass-title">端末を渡してください</h2>
            <p id="pass-message"></p>
            <button class="btn-primary" id="btn-pass-ok">準備OK</button>
        </div>
    </div>

    <script src="mastermind.js"></script>
</body>
</html>
