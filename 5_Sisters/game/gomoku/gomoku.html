<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>五目並べ</title>
    <link rel="stylesheet" href="gomoku.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 戻るボタン -->
    <button class="back-btn" onclick="history.back()">← 戻る</button>

    <!-- ====== スタート画面 ====== -->
    <div id="screen-start" class="screen active">
        <div class="start-box">
            <h1 class="game-title">五目並べ</h1>
            <p class="game-subtitle">Gomoku Narabe</p>
            <div class="rule-box">
                <p>15×15のボードに黒と白の石を交互に置います</p>
                <p>先に5つ並べた方が勝ち！</p>
                <p>横、縦、斜めのどの方向でもOK</p>
            </div>
            <button class="btn-primary" id="btn-start">ゲーム開始</button>
        </div>
    </div>

    <!-- ====== 先攻決め画面 ====== -->
    <div id="screen-coin" class="screen">
        <div class="coin-box">
            <h2>先攻を決めます</h2>
            <div id="coin" class="coin">
                <img id="coin-img" src="../mastermind/images/mastermind-miku.jpg" alt="coin">
            </div>
            <p id="coin-result" class="coin-result"></p>
            <button class="btn-primary" id="btn-toss">コイントス！</button>
            <button class="btn-secondary hidden" id="btn-go-game">ゲームへ進む</button>
        </div>
    </div>

    <!-- ====== メインゲーム画面 ====== -->
    <div id="screen-game" class="screen">

        <!-- ターン表示 -->
        <div class="turn-banner">
            <span id="turn-label">1P のターン</span>
        </div>

        <!-- ボード -->
        <div class="board-wrap">
            <div class="board" id="board">
                <!-- JSで生成 -->
            </div>
        </div>

        <!-- リセットボタン -->
        <div class="game-actions">
            <button class="btn-reset" id="btn-reset">ゲームをリセット</button>
        </div>

    </div>

    <!-- ====== 結果モーダル ====== -->
    <div id="modal-result" class="modal hidden">
        <div class="modal-box">
            <h2 id="modal-title">結果</h2>
            <p id="modal-message"></p>
            <button class="btn-primary" id="btn-next-round">もう一度遊ぶ</button>
            <button class="btn-secondary" id="btn-back">前のページへ戻る</button>
        </div>
    </div>

    <!-- ====== パス画面（端末を次のプレイヤーに渡す） ====== -->
    <div id="screen-pass" class="screen">
        <div class="pass-box">
            <h2 id="pass-title">端末を渡してください</h2>
            <p id="pass-message"></p>
            <button class="btn-primary" id="btn-pass-ok">準備OK</button>
        </div>
    </div>

    <script src="gomoku.js"></script>
</body>
</html>
