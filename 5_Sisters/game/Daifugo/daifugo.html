<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2d5016">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>大富豪 - 五等分の花嫁</title>
    <link rel="stylesheet" href="daifugo.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="home-back-btn" onclick="location.href='../../html/game_selection.html'">← ゲーム選択に戻る</button>
    
    <div class="game-container">
        <!-- トランプ装飾 -->
        <div class="card-decoration">
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
            <div class="decoration-card"></div>
        </div>

        <!-- ゲームヘッダー -->
        <header class="game-header">
            <h1 class="game-title">大富豪</h1>
        </header>

        <!-- ゲームフィールド -->
        <div class="game-field">
            <!-- CPU3人（上部横並び） -->
            <div class="cpu-players">
                <div class="cpu-player" id="cpu1-player">
                    <div class="cpu-avatar">👔</div>
                    <div class="cpu-info">
                        <div class="cpu-name" id="cpu1-name">アキラ</div>
                        <div class="cpu-badge" id="cpu1-badge">13</div>
                    </div>
                </div>
                <div class="cpu-player" id="cpu2-player">
                    <div class="cpu-avatar">👤</div>
                    <div class="cpu-info">
                        <div class="cpu-name" id="cpu2-name">ユキ</div>
                        <div class="cpu-badge" id="cpu2-badge">13</div>
                    </div>
                </div>
                <div class="cpu-player" id="cpu3-player">
                    <div class="cpu-avatar">🧑</div>
                    <div class="cpu-info">
                        <div class="cpu-name" id="cpu3-name">ヒデ</div>
                        <div class="cpu-badge" id="cpu3-badge">13</div>
                    </div>
                </div>
            </div>

            <!-- 中央の場 -->
            <div class="field-center">
                <div class="game-info">
                    <div class="status-badges">
                        <span class="badge" id="revolution-badge" style="display: none;">革命中</span>
                        <span class="badge" id="jback-badge" style="display: none;">11Back</span>
                        <span class="badge" id="shibari-badge" style="display: none;">縛り</span>
                    </div>
                    <div class="turn-indicator" id="turnIndicator"></div>
                </div>
                <div class="field-cards" id="fieldCards"></div>
                <div class="field-actions">
                    <button class="action-btn" id="passBtn">パス</button>
                    <button class="action-btn primary" id="playBtn" disabled>カードを出す</button>
                </div>
            </div>

            <!-- プレイヤー（下部） -->
            <div class="player-area" id="player-area">
                <div class="player-label">
                    <div class="player-icon">✏️</div>
                    <div class="player-name">YOU</div>
                    <div class="player-rank" id="player-rank"></div>
                </div>
                <div class="player-hand" id="playerHand"></div>
            </div>
        </div>
    </div>

    <!-- 勝敗結果モーダル -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">ゲーム終了</h3>
            </div>
            <div class="modal-body">
                <div id="resultContent" style="text-align: center; padding: 20px;">
                    <div id="rankResults" style="margin: 20px 0;"></div>
                </div>
                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button class="action-btn primary" id="replayBtn" style="flex: 1;">もう一度やる</button>
                    <button class="action-btn" id="backToTitleBtn" style="flex: 1;">タイトルに戻る</button>
                </div>
            </div>
        </div>
    </div>

    <script src="daifugo-rules.js"></script>
    <script src="daifugo-ui.js"></script>
    <script src="daifugo-ai.js"></script>
    <script src="daifugo.js"></script>
</body>
</html>
